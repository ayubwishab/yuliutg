<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catatan Hutang & Cicilan</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background-color: #f4f6f9;
      margin: 0;
      padding: 15px;
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 650px;
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }
    h2, h3 {
      text-align: center;
      color: #333;
      margin-top: 10px;
    }
    .form-group {
      margin-bottom: 12px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: 600;
      color: #444;
    }
    input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
    }
    button {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      margin-top: 5px;
    }
    .btn-submit {
      background-color: #28a745;
      color: white;
    }
    .btn-reset {
      background-color: #dc3545;
      color: white;
      margin-top: 20px;
    }
    .summary {
      display: flex;
      justify-content: space-between;
      background: #e9ecef;
      padding: 15px;
      border-radius: 8px;
      margin: 20px 0;
      font-weight: bold;
    }
    .summary-box {
      text-align: center;
      flex: 1;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      font-size: 14px;
    }
    th, td {
      border: 1px solid #e0e0e0;
      padding: 10px 8px;
      text-align: left;
    }
    th {
      background-color: #007bff;
      color: white;
    }
    .btn-action {
      padding: 6px 10px;
      font-size: 12px;
      margin: 2px;
      border-radius: 4px;
      border: none;
      cursor: pointer;
    }
    .btn-pay {
      background-color: #17a2b8;
      color: white;
    }
    .btn-history {
      background-color: #6c757d;
      color: white;
    }
    .btn-delete {
      background-color: #ffc107;
      color: #212529;
    }
    
    /* Modal Styles */
    .modal {
      display: none;
      position: fixed;
      z-index: 10;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
    }
    .modal-content {
      background-color: white;
      padding: 20px;
      border-radius: 8px;
      width: 90%;
      max-width: 500px;
      max-height: 80vh;
      overflow-y: auto;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #ddd;
      padding-bottom: 10px;
      margin-bottom: 15px;
    }
    .close-btn {
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      color: #aaa;
    }
    .close-btn:hover {
      color: #000;
    }
    ul.history-list {
      list-style-type: none;
      padding: 0;
      margin: 0;
    }
    ul.history-list li {
      padding: 8px 12px;
      border-bottom: 1px solid #eee;
      display: flex;
      justify-content: space-between;
      font-size: 13px;
    }
    ul.history-list li:nth-child(even) {
      background-color: #f8f9fa;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>Catatan Hutang Yuli</h2>

  <form id="debtForm">
    <div class="form-group">
      <label for="name">Nama / Keterangan</label>
      <input type="text" id="name" placeholder="Contoh: Bayar Pinjaman A" required>
    </div>
    <div class="form-group">
      <label for="amount">Jumlah Hutang (Rp)</label>
      <input type="number" id="amount" placeholder="Contoh: 500000" required>
    </div>
    <button type="submit" class="btn-submit">Tambah Hutang</button>
  </form>

  <div class="summary">
    <div class="summary-box">Total Hutang:<br><span id="totalDebt" style="color: #dc3545;">Rp 0</span></div>
    <div class="summary-box">Sisa Hutang:<br><span id="remainingDebt" style="color: #007bff;">Rp 0</span></div>
  </div>

  <h3>Daftar Hutang</h3>
  <div style="overflow-x: auto;">
    <table>
      <thead>
        <tr>
          <th>Keterangan</th>
          <th>Awal</th>
          <th>Sisa</th>
          <th>Aksi</th>
        </tr>
      </thead>
      <tbody id="debtTableBody">
      </tbody>
    </table>
  </div>

  <button id="resetBtn" class="btn-reset">Reset Semua Data</button>
</div>

<!-- Modal Riwayat Cicilan -->
<div id="historyModal" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <h3 id="modalTitle" style="margin:0;">Riwayat Cicilan</h3>
      <span class="close-btn" onclick="closeModal()">&times;</span>
    </div>
    <div id="modalBody">
      <ul id="historyList" class="history-list"></ul>
    </div>
  </div>
</div>

<script>
  let debts = JSON.parse(localStorage.getItem('my_debts')) || [];

  function formatRupiah(number) {
    return 'Rp ' + Number(number).toLocaleString('id-ID');
  }

  function getDateTimeNow() {
    const now = new Date();
    const day = String(now.getDate()).padStart(2, '0');
    const month = String(now.getMonth() + 1).padStart(2, '0');
    const year = now.getFullYear();
    const hours = String(now.getHours()).padStart(2, '0');
    const minutes = String(now.getMinutes()).padStart(2, '0');
    
    return `${day}/${month}/${year} ${hours}:${minutes}`;
  }

  function saveAndRender() {
    localStorage.setItem('my_debts', JSON.stringify(debts));
    render();
  }

  function render() {
    const tbody = document.getElementById('debtTableBody');
    tbody.innerHTML = '';

    let total = 0;
    let remaining = 0;

    debts.forEach((item, index) => {
      total += Number(item.amount);
      remaining += Number(item.remaining);

      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${item.name}</td>
        <td>${formatRupiah(item.amount)}</td>
        <td>${formatRupiah(item.remaining)}</td>
        <td>
          <button class="btn-action btn-pay" onclick="payDebt(${index})">Cicil</button>
          <button class="btn-action btn-history" onclick="showHistory(${index})">Riwayat</button>
          <button class="btn-action btn-delete" onclick="deleteDebt(${index})">Hapus</button>
        </td>
      `;
      tbody.appendChild(tr);
    });

    document.getElementById('totalDebt').innerText = formatRupiah(total);
    document.getElementById('remainingDebt').innerText = formatRupiah(remaining);
  }

  document.getElementById('debtForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const nameInput = document.getElementById('name');
    const amountInput = document.getElementById('amount');

    const name = nameInput.value.trim();
    const amount = Number(amountInput.value);

    if (name && amount > 0) {
      debts.push({
        name: name,
        amount: amount,
        remaining: amount,
        history: [{
          date: getDateTimeNow(),
          amount: amount,
          type: 'Awal'
        }]
      });
      nameInput.value = '';
      amountInput.value = '';
      saveAndRender();
    }
  });

  function payDebt(index) {
    if (debts[index].remaining <= 0) {
      alert('Hutang ini sudah lunas!');
      return;
    }

    const payAmount = prompt(`Bayar cicilan untuk "${debts[index].name}"\nSisa hutang: ${formatRupiah(debts[index].remaining)}\nMasukkan nominal bayar (Rp):`, 0);
    
    if (payAmount !== null) {
      const payment = Number(payAmount);
      if (!isNaN(payment) && payment > 0) {
        if (payment > debts[index].remaining) {
          alert('Nominal pembayaran melebihi sisa hutang!');
          return;
        }

        debts[index].remaining = debts[index].remaining - payment;
        debts[index].history.push({
          date: getDateTimeNow(),
          amount: payment,
          type: 'Cicilan'
        });

        saveAndRender();
      }
    }
  }

  function showHistory(index) {
    const item = debts[index];
    document.getElementById('modalTitle').innerText = `Riwayat: ${item.name}`;
    const historyList = document.getElementById('historyList');
    historyList.innerHTML = '';

    if (!item.history || item.history.length === 0) {
      historyList.innerHTML = '<li>Belum ada riwayat transaksi</li>';
    } else {
      item.history.forEach(h => {
        const li = document.createElement('li');
        li.innerHTML = `
          <span><b>${h.date}</b> (${h.type})</span>
          <span style="color: ${h.type === 'Cicilan' ? '#28a745' : '#dc3545'}; font-weight: bold;">
            ${h.type === 'Cicilan' ? '-' : ''}${formatRupiah(h.amount)}
          </span>
        `;
        historyList.appendChild(li);
      });
    }

    document.getElementById('historyModal').style.display = 'flex';
  }

  function closeModal() {
    document.getElementById('historyModal').style.display = 'none';
  }

  window.onclick = function(event) {
    const modal = document.getElementById('historyModal');
    if (event.target === modal) {
      modal.style.display = 'none';
    }
  };

  function deleteDebt(index) {
    if (confirm(`Yakin ingin menghapus catatan "${debts[index].name}"?`)) {
      debts.splice(index, 1);
      saveAndRender();
    }
  }

  document.getElementById('resetBtn').addEventListener('click', function() {
    if (confirm('PERINGATAN: Apakah Anda yakin ingin menghapus SEMUA data hutang dan riwayatnya?')) {
      debts = [];
      localStorage.removeItem('my_debts');
      render();
    }
  });

  render();
</script>

</body>
</html>
